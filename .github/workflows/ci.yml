name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 yt-dlp pytest pytest-qt ruff

      - name: Lint (ruff)
        run: python -m ruff check app main.py tests

      - name: Tests (offscreen, network excluded)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
